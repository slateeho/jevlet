apiVersion: apps/v1
kind: Deployment
metadata:
  name: jevlet-controller
  namespace: jevlet-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jevlet
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jevlet
    spec:
      serviceAccountName: jevlet-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/slateeho/jevlet:latest
          imagePullPolicy: IfNotPresent
          args: ["--leader-elect=true"]
          env:
            - name: TYPESAFE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: jevlet-typesafe
                  key: api-key
            - name: JEV_MODEL
              value: jev-latest
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet: {path: /readyz, port: health}
          livenessProbe:
            httpGet: {path: /healthz, port: health}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
