apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: jevpolicies.jevlet.io
spec:
  group: jevlet.io
  scope: Namespaced
  names:
    plural: jevpolicies
    singular: jevpolicy
    kind: JevPolicy
    shortNames: [jp]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              required: [selector]
              properties:
                selector:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                signals:
                  type: object
                  properties:
                    kubernetesEvents: {type: boolean}
                    maxEvents: {type: integer, format: int32, minimum: 1, maximum: 20}
                    prometheus:
                      type: object
                      required: [url]
                      properties:
                        url: {type: string}
                        queries:
                          type: object
                          additionalProperties: {type: string}
                decision:
                  type: object
                  properties:
                    model: {type: string}
                execution:
                  type: object
                  properties:
                    mode: {type: string, enum: [observe, guarded]}
                    allowedActions:
                      type: array
                      items: {type: string, enum: [noop, escalate, restart_pod]}
                    minimumConfidence: {type: number, minimum: 0, maximum: 1}
                    minimumSafeToExecute: {type: number, minimum: 0, maximum: 1}
                    maximumRiskScore: {type: number, minimum: 0, maximum: 4}
                    cooldown: {type: string}
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
