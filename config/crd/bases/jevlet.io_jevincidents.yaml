apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: jevincidents.jevlet.io
spec:
  group: jevlet.io
  scope: Namespaced
  names:
    plural: jevincidents
    singular: jevincident
    kind: JevIncident
    shortNames: [ji]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Action
          type: string
          jsonPath: .status.decision.action
        - name: Approved
          type: boolean
          jsonPath: .status.decision.approved
        - name: Executed
          type: boolean
          jsonPath: .status.decision.executed
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              required: [policyName, target, issueReason, stateDigest]
              properties:
                policyName: {type: string}
                issueReason: {type: string}
                stateDigest: {type: string}
                target:
                  type: object
                  required: [kind, namespace, name, uid]
                  properties:
                    apiVersion: {type: string}
                    kind: {type: string}
                    namespace: {type: string}
                    name: {type: string}
                    uid: {type: string}
                    ownerKind: {type: string}
                    ownerName: {type: string}
                    ownerUID: {type: string}
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
